<script>try{if(localStorage.getItem("rr-theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<style>
:root{
  --paper:#FFFFFF;
  --surface:#FFFFFF;
  --hover:#E3E6E9;
  --bar:#E6E8EB;
  --glass:rgba(255,255,255,.92);
  --free:#1C1C1E;
  --chrome:#EEF0F2;
  --ink:#1C1C1E;
  --ink-2:#5B6169;
  --rule:#D5D9DE;
  --walk:#A7ADB4;
  --go:#00A651;
  --stop:#E60012;
  --line:#F39700;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
  --sign:"Overpass","Zen Kaku Gothic New",sans-serif;
  --mono:"Overpass Mono",ui-monospace,monospace;
  --dot:"DotGothic16",monospace;
  color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#121821;
  --surface:#1A222D;
  --chrome:#0C1117;
  --ink:#E8ECF1;
  --ink-2:#9AA4B1;
  --rule:#2A3340;
  --walk:#7E8996;
  --hover:#222B37;
  --bar:#2A3340;
  --glass:rgba(18,24,33,.9);
  --free:#6B7684;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #00A7DB;outline-offset:2px}
#app{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-areas:"panel map";height:100vh;height:100svh;overflow:hidden}

/* ---------- map column ---------- */
#mapcol{grid-area:map;display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0;background:var(--paper)}
#lcd{display:flex;align-items:stretch;background:#000;color:#fff;min-height:58px;overflow:hidden}
.lcd-kind{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;background:var(--line);color:#fff;font-weight:900;line-height:1.15;min-width:92px}
.lcd-kind b{font-size:20px;letter-spacing:.08em}
.lcd-kind small{font-size:11px;font-weight:700;opacity:.92}
.lcd-dest{display:flex;flex-direction:column;justify-content:center;padding:4px 16px;border-right:1px solid #333;min-width:120px}
.lcd-dest small{font-size:11px;color:#BDBDBD}
.lcd-dest b{font-size:19px;font-weight:900;letter-spacing:.1em;color:#FFB000}
.lcd-dest b.ok{color:#5BE37D}.lcd-dest b.ng{color:#FF5A5A}
#lcdChars{display:flex;align-items:center;gap:3px;padding:0 14px;overflow:hidden;flex:1;min-width:0}
.ch{min-width:26px;height:34px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono);font-weight:700;font-size:20px;color:#FFB000;border-bottom:3px solid transparent}
.ch.done{color:#5A4A1E}
.ch.now{background:#FFB000;color:#000;border-radius:3px}
.ch.end{font-family:var(--sans);font-size:12px;color:#BDBDBD}
#mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--paper)}
#map{background:var(--paper);position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#hudbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--rule);background:var(--paper);min-height:52px}
.ctr{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--ink-2)}
.ctr b{font-family:var(--sign);font-weight:900;font-size:24px;color:var(--ink);line-height:1}
.ctr code{font-family:var(--mono);font-size:13px;color:var(--ink)}
#stepLog{flex:1;min-width:200px;font-size:13px;color:var(--ink)}
.chipv{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:1px 9px;margin-left:6px;background:var(--go);color:#fff}
.chipv.bad{background:var(--stop)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 13px;font-size:13px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#buildMsg{position:absolute;left:16px;top:12px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--glass);padding:2px 8px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .4s}
#buildMsg.show{opacity:1}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* first-visit guide */
#tour{position:absolute;left:0;top:0;z-index:5;width:min(300px,calc(100% - 24px));background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .25s}
#tour.show{opacity:1;visibility:visible}
.tour-step{font-family:var(--sign);font-size:11px;font-weight:800;color:var(--ink-2);letter-spacing:.04em}
#tour h3{margin:0 0 3px;font-size:15px;font-weight:900}
#tour p{margin:0 0 9px;font-size:13px;line-height:1.6}
.tour-btns{display:flex;gap:8px;justify-content:flex-end}
.tour-btns .btn{padding:4px 12px;font-size:13px}
.tour-ring{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:5 5}

#legend{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:3px;background:var(--glass);padding:8px 10px;border-radius:6px;box-shadow:0 0 0 1px var(--rule);font-size:11px;font-weight:700;pointer-events:none;max-width:46%}
.lg{display:flex;align-items:center;gap:7px}
.lg-b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border:3.5px solid;border-radius:10px;font-family:var(--sign);font-weight:900;font-size:11px;line-height:1;background:var(--surface);white-space:nowrap}
.lg-w{display:inline-block;width:20px;border-top:3px dotted var(--walk)}
/* infographic overlay on the map */
#versus{position:absolute;right:16px;bottom:16px;width:min(380px,calc(100% - 32px));background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:12px 14px 12px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}
#versus.show{opacity:1;transform:none}

/* ---------- side panel ---------- */
#panel>*{flex-shrink:0}
#panel{grid-area:panel;background:var(--chrome);border-right:1px solid var(--rule);overflow-y:auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:20px;z-index:2}
.sign{background:var(--surface);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
.sign-top{display:flex;align-items:center;gap:12px;padding:10px 14px 6px}
.sign-num{display:grid;place-items:center;width:46px;height:46px;border:5px solid var(--line);border-radius:50%;background:var(--surface);line-height:1;flex:none;font-family:var(--sign)}
.sign-num small{font-size:10px;font-weight:800;margin-top:3px}
.sign-num b{font-size:18px;font-weight:900;margin-top:-3px}
.sign h1{margin:0;font-size:28px;line-height:1.1;font-weight:900;letter-spacing:.1em}
.sign p{margin:2px 0 0;font-size:11px;letter-spacing:.05em;color:var(--ink-2);font-family:var(--sign);font-weight:700}
.sign-band{display:flex;justify-content:space-between;background:var(--line);color:#fff;font-size:12px;font-weight:700;padding:3px 12px}
.field-name{font-size:13px;color:var(--ink-2);margin:0 0 6px;font-weight:700}
.rxrow{display:flex;gap:8px}
#rx{flex:1;min-width:0;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:8px 11px;font-family:var(--mono);font-weight:700;font-size:19px}
#rx.bad{border-color:var(--stop)}
.btn{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:6px 13px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.go{background:var(--ink);color:var(--paper)}
.btn.go:hover{background:var(--ink);opacity:.86}
#rxErr{min-height:20px;font-size:13px;color:var(--stop);margin-top:6px;font-family:var(--mono);white-space:pre;overflow-x:auto}
#rxStat{font-size:13px;color:var(--ink-2)}
#rxStat b{color:var(--ink);font-family:var(--sign);font-weight:800}
.modes{margin-top:10px}
.theme-m{display:none;align-self:flex-start}
.samples{display:flex;flex-direction:column;gap:2px}
.chip{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px}
.chip:hover{background:var(--hover)}
.chip[aria-current=true]{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.chip i{width:22px;height:22px;border-radius:50%;border:5px solid var(--c);background:var(--surface)}
.chip code{font-family:var(--mono);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{font-size:11px;color:var(--ink-2);text-align:right}
.ticket{display:flex;gap:8px}
#str{flex:1;min-width:0;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:7px 11px;font-family:var(--mono);font-weight:700;font-size:17px}
.runrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#list{width:100%;min-height:92px;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:14px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--ink-2);margin:6px 0 0}
/* versus infographic (shared by panel card and map overlay) */
.vs-title{font-size:13px;font-weight:900;margin:0 0 8px}
.vs-row{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;margin-bottom:8px}
.vs-row .nm{font-size:12px;font-weight:700;line-height:1.3}
.vs-num{font-family:var(--sign);font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.vs-bar{grid-column:2;height:10px;border-radius:5px;background:var(--bar);overflow:hidden}
.vs-bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .2s linear}
.vs-row.bt .vs-num{color:var(--stop)}.vs-row.bt .vs-bar i{background:var(--stop)}
.vs-row.nfa .vs-num{color:var(--go)}.vs-row.nfa .vs-bar i{background:var(--go)}
.vs-note{font-size:11px;color:var(--ink-2);margin:0}
#vsCard{background:var(--surface);border-radius:8px;padding:12px 14px;box-shadow:0 0 0 1px var(--rule)}
#vsCard[hidden]{display:none}
/* LED board (flat) */
.board{background:#000;border-radius:6px;padding:8px 10px 6px;font-family:var(--dot);color:#FF9F1C}
.board-head{display:grid;grid-template-columns:3.1em 2.6em 1fr 6.2em;gap:6px;color:#fff;font-size:12px;border-bottom:1px solid #333;padding-bottom:3px;margin-bottom:3px}
.board-rows{display:flex;flex-direction:column;gap:1px;min-height:44px}
.brow{display:grid;grid-template-columns:3.1em 2.6em 1fr 6.2em;gap:6px;align-items:center;font-size:14px;line-height:1.45}
.brow .code{display:inline-block;width:100%;text-align:center;color:#000;background:var(--c);border-radius:2px;font-size:11px;line-height:1.55}
.brow .dest{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .st{text-align:right;white-space:nowrap}
.brow.run .st{animation:blink 1s steps(2) infinite}
.brow.ok .st{color:#47E07A}.brow.ng .st{color:#FF4D4D}
.brow.wait{color:#6B4A12}
.brow .vf{font-size:10px;color:#7FD7FF;margin-left:3px}
.brow .vf.bad{color:#fff;background:var(--stop);padding:0 3px}
@keyframes blink{50%{opacity:.3}}
.board-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #333;margin-top:4px;padding-top:3px;font-size:11px;color:#fff}

/* ---------- SVG map ---------- */
#map text{font-family:var(--sign);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.walk{fill:none;stroke:var(--walk);stroke-width:3;stroke-linecap:round;stroke-dasharray:.1 7}
.walk-base{fill:none;stroke:var(--paper);stroke-width:9;stroke-linecap:round}
.casing{fill:none;stroke:var(--paper);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.tline{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.stub{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 6}
.st-circ{fill:var(--paper);stroke:var(--ink);stroke-width:3.5}
.st-junc{fill:var(--paper);stroke:var(--walk);stroke-width:2.5}
.st-name{font-weight:900;font-size:14px;fill:var(--ink)}
.st-desc{font-family:var(--sans)!important;font-weight:700;font-size:10.5px;fill:var(--ink-2)}
.st-jnum{font-weight:700;font-size:9px;fill:var(--walk)}
.badge text{fill:var(--ink)}
.badge circle,.badge rect{fill:var(--paper);stroke-width:4.5}
.badge text{font-weight:900;font-size:13px;text-anchor:middle;dominant-baseline:central;stroke:none!important}
.badge.hot circle,.badge.hot rect{fill:var(--bc)}
.badge.hot text{fill:#fff!important}
.halo{opacity:.2}
.accept-badge rect{fill:var(--go)}
.accept-badge text{fill:#fff;font-weight:900;font-size:14px;stroke:none!important;font-family:var(--sans)!important}
.ring{fill:none}
.depot{fill:var(--ink)}
.depot-ic{stroke:var(--paper)}
.xmark{stroke:var(--stop);stroke-width:3.5;stroke-linecap:round}
.train .body{stroke-width:2.5}

@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;grid-template-areas:"map" "panel";height:auto;min-height:100svh;overflow:visible}
  #mapcol{height:72svh;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--rule)}
  #lcd{min-height:46px}
  .lcd-kind{min-width:64px;padding:4px 9px}.lcd-kind b{font-size:15px}.lcd-kind small{font-size:9px}
  .lcd-dest{min-width:0;padding:3px 9px}.lcd-dest b{font-size:14px}.lcd-dest small{font-size:9px}
  #lcdChars{padding:0 8px;gap:2px}
  .ch{min-width:17px;height:26px;font-size:15px;padding:0 2px}
  #hudbar{gap:10px;padding:6px 10px;min-height:0}
  .ctr b{font-size:19px}
  #stepLog{font-size:11.5px;min-width:100%;order:9;line-height:1.45}
  #panel{border-right:0;overflow:visible;padding:14px 14px 40px}
  .sign h1{font-size:24px}
  #versus{right:10px;bottom:10px;padding:10px 12px}
  #legend{display:none}
  .theme-d{display:none}
  .theme-m{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){ .brow.run .st{animation:none} }
/* language switch (日本語 / English) */
.langrow{display:flex;justify-content:flex-end;margin-bottom:-10px}
.langsw button{padding:2px 11px;font-size:12px}
html[lang=en] .sign h1{font-size:24px;letter-spacing:.04em}
@media (max-width:900px){ html[lang=en] .sign h1{font-size:21px} }
</style>
<style>
/* ramda.io: 解説動画の埋め込み */
.rv{box-sizing:border-box;width:100%;max-width:360px;margin:32px auto 28px;padding:0 4px}
.rv-h{font-size:17px;line-height:1.4;margin:0 0 10px;font-weight:700}
.rv-frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000}
.rv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rv-ch{font-size:13px;line-height:1.6;margin:10px 0 0}
.rv-ch a{color:inherit}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="app">
  <main id="mapcol">
    <div id="lcd" aria-live="polite">
      <div class="lcd-kind"><b data-i18n="lcdKind">各停</b><small id="lcdLine" data-i18n="signTitle">正規表現線</small></div>
      <div class="lcd-dest"><small id="lcdDestS" data-i18n="lcdDestS">行先</small><b id="lcdDest" data-i18n="accept">受理</b></div>
      <div id="lcdChars"></div>
    </div>
    <div id="mapwrap">
      <svg id="map" role="img" aria-label="正規表現から作った路線図" data-i18n-attr="aria-label:mapAria"></svg>
      <div id="buildMsg"></div>
      <div id="toast"></div>
      <div id="tour" role="dialog" aria-label="はじめての案内" data-i18n-attr="aria-label:tourAria" aria-live="polite">
        <div class="tour-step" id="tourStep"></div>
        <h3 id="tourTitle"></h3>
        <p id="tourText"></p>
        <div class="tour-btns"><button class="btn" id="tourSkip" data-i18n="tourSkip">案内を閉じる</button><button class="btn go" id="tourNext">続ける</button></div>
      </div>
      <div id="versus" aria-hidden="true"></div>
      <div id="legend" aria-label="凡例" data-i18n-attr="aria-label:legendAria"></div>
    </div>
    <div id="hudbar">
      <div class="ctr"><b id="mTrains">0</b><span data-i18n="ctrRunning">本 走行中</span></div>
      <div class="ctr"><b id="mMax">0</b><span data-i18n="ctrMax">本 最大</span></div>
      <div class="ctr"><span data-i18n="ctrSet">状態集合</span> <code id="mSet">{}</code></div>
      <div id="stepLog"></div>
      <div class="seg" role="group" aria-label="地図の表示" data-i18n-attr="aria-label:camAria">
        <button data-cam="auto" aria-pressed="true" data-i18n="camAuto">追跡</button>
        <button data-cam="all" aria-pressed="false" data-i18n="camAll">全体</button>
      </div>
      <div class="seg theme-d" role="group" aria-label="配色" data-i18n-attr="aria-label:themeAria">
        <button data-theme="light" aria-pressed="true" data-i18n="themeDay">昼</button>
        <button data-theme="dark" aria-pressed="false" data-i18n="themeNight">夜</button>
      </div>
    </div>
  </main>

  <aside id="panel">
    <div class="langrow">
      <div class="seg langsw" role="group" aria-label="言語" data-i18n-attr="aria-label:langAria">
        <button data-lang="ja" lang="ja" aria-pressed="true">日本語</button>
        <button data-lang="en" lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="sign" aria-hidden="true">
      <div class="sign-top">
        <div class="sign-num"><small>RX</small><b id="signNo">01</b></div>
        <div><h1 data-i18n="signTitle">正規表現線</h1><p>Regular Expression Line</p></div>
      </div>
      <div class="sign-band"><span data-i18n="bandFrom">← 文字列</span><span data-i18n="bandTo">受理 →</span></div>
    </div>

    <div class="seg theme-m" role="group" aria-label="配色" data-i18n-attr="aria-label:themeAria">
      <button data-theme="light" aria-pressed="true" data-i18n="themeDayM">昼の路線図</button>
      <button data-theme="dark" aria-pressed="false" data-i18n="themeNightM">夜の路線図</button>
    </div>

    <section>
      <h2 class="field-name"><label for="rx" data-i18n="fRx">正規表現</label></h2>
      <div class="rxrow">
        <input id="rx" spellcheck="false" autocomplete="off" autocapitalize="off" value="(a|b)*abb">
        <button class="btn" id="bBuild" data-i18n="bBuild">路線図を作る</button>
      </div>

/* ============================================================
   Octilinear serpentine layout
   ============================================================ */
const DX=100, DXJ=50, DY=66, LG=18, GL=13, FIL=16, PORT=8, SCALE_CAP=1.35;
function layoutMap(nfa,vw,vh){
  const E=nfa.edges, n=nfa.n;
  const hasChar=nfa.out.map(l=>l.some(ei=>E[ei].cs));
  const sig=s=>hasChar[s]||s===nfa.accept||s===nfa.start;
  // back edges (DFS from the depot)
  const col=new Uint8Array(n), back=new Set();
  const dfs=s=>{ col[s]=1; for(const ei of nfa.out[s]){ const t=E[ei].to; if(col[t]===1) back.add(ei); else if(!col[t]) dfs(t); } col[s]=2; };
  dfs(nfa.start); for(let s=0;s<n;s++) if(!col[s]) dfs(s);
  // longest-path layers on the forward edges
  const indeg=new Array(n).fill(0); E.forEach(e=>{ if(!back.has(e.id)) indeg[e.to]++; });
  const layer=new Array(n).fill(0), q=[]; for(let s=0;s<n;s++) if(!indeg[s]) q.push(s);
  while(q.length){ const s=q.shift(); for(const ei of nfa.out[s]){ if(back.has(ei)) continue; const t=E[ei].to; layer[t]=Math.max(layer[t],layer[s]+1); if(--indeg[t]===0) q.push(t); } }
  const L=Math.max(...layer)+1;
  const byL=Array.from({length:L},()=>[]); for(let s=0;s<n;s++) byL[layer[s]].push(s);
  // lanes: stay on the line you came from; branches step aside
  const lane=new Array(n).fill(0), preds=Array.from({length:n},()=>[]);
  E.forEach(e=>{ if(!back.has(e.id)&&e.from!==e.to) preds[e.to].push(e.from); });
  for(let l=0;l<L;l++){
    const items=byL[l].map(s=>({s,want:preds[s].length?preds[s].reduce((a,p)=>a+lane[p],0)/preds[s].length:0}));
    items.sort((a,b)=>a.want-b.want||a.s-b.s);
    const used=new Set();
    for(const it of items){ let best=null; for(let d=0;d<40&&best===null;d++){ for(const c of [Math.round(it.want)+d,Math.round(it.want)-d]) if(!used.has(c)){ best=c; break; } } used.add(best); lane[it.s]=best; }
  }
  const lw=byL.map(ss=>ss.some(sig)?DX:DXJ);
  // how many layers per row: try every fold, keep the one that reads best in this frame
  // (largest fitted scale up to a cap, with a cost per fold and per track that crosses rows)
  let best=null;
  for(let k=Math.min(L,3);k<=L;k++){
    const r=arrange(k);
    const sc=Math.min(vw/(r.bbox.w+40),vh/(r.bbox.h+40),SCALE_CAP);
    const lastRow=L-(r.rows-1)*k;
    // below ~0.8 the station names get hard to read, so small scales cost extra
    const read=sc<.8?sc*sc/.8:sc;
    const score=read*Math.pow(.97,r.cross)*Math.pow(.96,r.rows-1)*(r.rows>1&&lastRow<2?.8:1);
    if(!best||score>=best.score-1e-9) best=Object.assign(r,{score,K:k});
  }
  const {N,routes,spec,rows,dirOf,K}=best;
  const paths=routes.map((c,i)=>{ const p=densify(c,E[i].from===E[i].to?8:FIL); p.corners=c; return p; });
  // badge: middle of the longest straight run
  paths.forEach((p,i)=>{ if(!E[i].cs) return; const c=p.corners; let bi=0,bl=-1; for(let k=0;k<c.length-1;k++){ const l=Math.hypot(c[k+1][0]-c[k][0],c[k+1][1]-c[k][1])-(k===0||k===c.length-2?14:0); if(l>bl){ bl=l; bi=k; } }
    p.badge=[(c[bi][0]+c[bi+1][0])/2,(c[bi][1]+c[bi+1][1])/2]; });
  const s0=N[nfa.start], d0=dirOf(s0.row);
  const depot=densify([[s0.x-d0*54,s0.y],[s0.x,s0.y]],0);
  const labels=placeLabels(nfa,N,paths,depot,E);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const acc=(x,y)=>{ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); };
  N.forEach(v=>{ acc(v.x-22,v.y-22); acc(v.x+22,v.y+22); });
  labels.rects.forEach(r=>{ acc(r.x0,r.y0); acc(r.x1,r.y1); });
  { const a=N[nfa.accept]; acc(a.x-32,a.y-50); }
  paths.forEach(p=>{ for(let k=0;k<p.N;k+=4) acc(p.xs[k],p.ys[k]); });
  acc(s0.x-d0*70,s0.y);
  return {N,paths,depot,spec,back,bbox:{x:x0-16,y:y0-16,w:x1-x0+32,h:y1-y0+32},K,rows,dirOf};

  function arrange(K){
    const rowOf=l=>Math.floor(l/K), rows=Math.ceil(L/K), dirOf=r=>r%2?-1:1;
    const lx=new Array(L), rowW=new Array(rows).fill(0);
    for(let r=0;r<rows;r++){ let cum=0; for(let l=r*K;l<Math.min(L,(r+1)*K);l++){ lx[l]=cum+lw[l]/2; cum+=lw[l]; } rowW[r]=cum; }
    const W=Math.max(...rowW);
    for(let l=0;l<L;l++){ const r=rowOf(l); if(r%2) lx[l]=W-lx[l]; lx[l]+=60; }
    const N=Array.from({length:n},(_,s)=>({id:s,layer:layer[s],lane:lane[s],row:rowOf(layer[s]),x:lx[layer[s]],y:0,sig:sig(s),acc:s===nfa.accept,start:s===nfa.start,indeg:0}));
    E.forEach(e=>{ if(e.from!==e.to) N[e.to].indeg++; });
    const rLmin=new Array(rows).fill(1e9), rLmax=new Array(rows).fill(-1e9);
    N.forEach(v=>{ rLmin[v.row]=Math.min(rLmin[v.row],v.lane); rLmax[v.row]=Math.max(rLmax[v.row],v.lane); });
    const spec=E.map(e=>{
      const u=N[e.from], v=N[e.to];
      if(u.row!==v.row) return {kind:"cross",g:Math.min(u.row,v.row)};
      if(e.from===e.to||back.has(e.id)||v.layer<=u.layer) return {kind:"loop"};
      if(v.layer-u.layer>1){
        const lo=Math.min(u.lane,v.lane), hi=Math.max(u.lane,v.lane);
        if(N.some(w=>w.row===u.row&&w.layer>u.layer&&w.layer<v.layer&&w.lane>=lo&&w.lane<=hi)) return {kind:"bypass"};
      }
      return {kind:"direct"};
    });
    const levelsOf=kind=>{ const per=Array.from({length:rows},()=>[]), maxL=new Array(rows).fill(0);
      E.forEach((e,i)=>{ if(spec[i].kind!==kind) return; const a=N[e.from].x, b=N[e.to].x; per[N[e.from].row].push({i,x0:Math.min(a,b)-14,x1:Math.max(a,b)+14}); });
      per.forEach((list,r)=>{ list.sort((p,q)=>(p.x1-p.x0)-(q.x1-q.x0)); const placed=[];
        for(const it of list){ let lv=1; while(placed.some(p=>p.lv===lv&&p.x0<it.x1&&it.x0<p.x1)) lv++; it.lv=lv; placed.push(it); spec[it.i].lv=lv; maxL[r]=Math.max(maxL[r],lv); } });
      return maxL; };
    const loopL=levelsOf("loop"), byL2=levelsOf("bypass");
    const gapN=new Array(rows).fill(0);
    let cross=0;
    E.forEach((e,i)=>{ if(spec[i].kind==="cross"){ spec[i].gl=gapN[spec[i].g]++; cross++; } });
    // ports: tracks that leave a station on the same side get their own x, nested so they never cross
    const port=new Map();

  lcdEnd=null;
  if(!svc){ return; }
  [...svc.str].forEach(ch=>{ const d=document.createElement("span"); d.className="ch"; d.textContent=showCh(ch); box.appendChild(d); });
  const e=document.createElement("span"); e.className="ch end"; box.appendChild(e);
  lcdEnd=()=>{ e.textContent=svc.str.length?L_("lcdEnd"):L_("lcdEmpty"); }; lcdEnd();
  setDest(()=>{ $("lcdDestS").textContent=L_("lcdDestS"); const d=$("lcdDest"); d.className=""; d.textContent=searchMode?L_("found"):L_("accept"); });
}
let hotKey=null;
function setHot(ch){
  const key=ch===null?null:ch; if(key===hotKey) return; hotKey=key;
  NET.badgeEls.forEach(b=>{ if(b) b.g.classList.toggle("hot",ch!==null&&RX.csTest(b.cs,ch)); });
}
function updateHud(){
  const svc=hudFor;
  if(!svc||!NET){ setHot(null); return; }
  const t=simT-svc.t0, pl=svc.plan;
  const consumed=svc.consumeT.filter(c=>c<=t).length;
  const chs=$("lcdChars").children;
  const key=consumed+":"+(svc.result===undefined);
  if(key!==lcdKey){ lcdKey=key; for(let i=0;i<chs.length-1;i++) chs[i].className="ch"+(i<consumed?" done":"")+(i===consumed&&svc.result===undefined?" now":""); const now=chs[consumed]; if(now&&now.scrollIntoView&&svc.str.length>12) now.parentElement.scrollLeft=Math.max(0,now.offsetLeft-80); }
  setHot(svc.result===undefined&&consumed<svc.str.length&&t>0?svc.str[consumed]:null);
  let k=0; for(let i=0;i<pl.steps.length;i++) if(pl.steps[i].t0<=t+1e-6) k=i;
  const S=pl.steps[k];
  let live=0; for(const tr of pl.trains) if(t>=tr.born&&t<tr.end) live++;
  $("mTrains").textContent=live;
  $("mSet").textContent="{"+(t>=S.tClose?S.set:[]).join(", ")+"}";
  if(k!==hudK&&t>=S.tClose&&svc.result===undefined){
    hudK=k;
    const ev=pl.events.filter(e=>e.k===k);
    const sp=ev.filter(e=>e.type==="split").length, mg=ev.filter(e=>e.type==="merge").length, dr=ev.filter(e=>e.type==="derail").length;
    setLog(()=>{
    let msg=k===0?L_("logStart",{n:S.set.length}):L_("logAfter",{c:showCh(pl.str[k-1]),n:S.set.length});
    msg+=L_("logCounts",{sp,mg});
    if(S.ch!=null) msg+=L_("logNext",{c:showCh(S.ch),n:S.trains});
    if(dr) msg+=L_("logDerail",{n:dr});
    $("stepLog").textContent=LANG==="en"?msg.trim():msg;
    });
  }
}
function hudFinal(svc){
  const ok=svc.result, pl=svc.plan;
  const sm=searchMode;
  setDest(()=>{ const d=$("lcdDest"); d.textContent=ok?(sm?L_("dFoundOk"):L_("dAcceptOk")):(sm?L_("dNoMatch"):L_("dReject")); d.className=ok?"ok":"ng"; $("lcdDestS").textContent=ok?L_("dsArrived"):L_("dsEnded"); });
  setLog(()=>{
  const why=ok?(sm?L_("whyFound"):L_("whyAccept")):(pl.result.dead?L_("whyDead",{k:pl.result.k+1,c:showCh(pl.str[pl.result.k])}):L_("whyNone"));
  const log=$("stepLog"); log.textContent=(ok?L_("preOk"):L_("preNg"))+why;
  const c=document.createElement("span"); c.className="chipv"+(svc.verified?"":" bad"); c.textContent=svc.verified?L_("vOk"):L_("vNg"); log.appendChild(c);
  });
  setHot(null);
  for(const ch of $("lcdChars").children) ch.classList.remove("now");
  if(!searchMode) showVersus(svc,true);
  if(tour.stage>=0) tourEnd(true);
}
/* the backtracking comparison infographic */
let vsAnim=null, vsLast=null, vsNote=null;
function versusMarkup(){ return `<p class="vs-title" data-i18n="vsTitle">${L_("vsTitle")}</p>
  <div class="vs-row bt"><div class="nm" data-i18n-html="vsBt">${L_("vsBt")}</div><div><div class="vs-num" data-k="bt">0</div></div><div class="vs-bar"><i data-k="btb"></i></div></div>
  <div class="vs-row nfa"><div class="nm" data-i18n="vsNfa">${L_("vsNfa")}</div><div><div class="vs-num" data-k="nfa">0</div></div><div class="vs-bar"><i data-k="nfab"></i></div></div>
  <p class="vs-note" data-k="note"></p>`; }
$("vsCard").innerHTML=versusMarkup(); $("versus").innerHTML=versusMarkup();
function showVersus(svc,overlay){
  const bt=RX.btCount(NET.parsed.ast,svc.str);
  const nSteps=svc.str.length, maxT=svc.maxTrains, nfaWork=Math.max(1,nSteps)*Math.max(1,maxT);
  const big=bt.capped?3e6:bt.steps;
  const ratio=big/nfaWork;
  const card=$("vsCard"); card.hidden=false;
  const show=ratio>200&&overlay&&!reduceMotion;
  if(show){ $("versus").classList.add("show"); clearTimeout(showVersus.to); showVersus.to=setTimeout(()=>$("versus").classList.remove("show"),8000); }
  vsAnim={t0:performance.now(),bt:big,capped:bt.capped,nfa:nfaWork,nSteps,maxT};
  vsNote=()=>{ for(const root of [card,$("versus")]) root.querySelector('[data-k="note"]').textContent=L_("vsNote",{n:nSteps,m:maxT,capped:bt.capped}); }; vsNote();
  vsLast=vsAnim;
}
function updateVersus(){
  if(!vsAnim) return;
  const k=easeOut((performance.now()-vsAnim.t0)/2400);
  drawVersus(vsAnim,k);
  if(k>=1) vsAnim=null;
}
function drawVersus(vsAnim,k){
  const max=Math.log10(vsAnim.bt+1);
  for(const root of [$("vsCard"),$("versus")]){
    root.querySelector('[data-k="bt"]').textContent=Math.round(vsAnim.bt*k).toLocaleString()+(vsAnim.capped&&k>=1?L_("stepsCap"):L_("steps"));
    root.querySelector('[data-k="btb"]').style.width=(100*Math.log10(vsAnim.bt*k+1)/max).toFixed(1)+"%";
    root.querySelector('[data-k="nfa"]').textContent=Math.round(vsAnim.nfa*Math.min(1,k*3)).toLocaleString()+L_("steps");
    root.querySelector('[data-k="nfab"]').style.width=(100*Math.log10(vsAnim.nfa*Math.min(1,k*3)+1)/max).toFixed(1)+"%";
  }
}

/* ============================================================
   Departure board
   ============================================================ */
let boardT=0;
function renderBoard(force){
  const now=performance.now(); if(!force&&now-boardT<250) return; boardT=now;
  for(const s of services) if(!history.includes(s)) history.push(s);
  if(history.length>60) history=history.slice(-60);
  const q=massOn?massQueue.slice(0,3).map((str,i)=>({str,depart:clockLabel(svcSeq+i),code:"—",col:"#555",waiting:true})):[];
  const all=history.concat(q);
  const box=$("boardRows"); box.textContent="";
  for(const s of all.slice(-9)){
    const st=s.waiting?"wait":s.result===undefined?"run":(s.result?"ok":"ng");
    const d=document.createElement("div"); d.className="brow "+st;
    const label=st==="wait"?L_("bWait"):st==="run"?L_("bRunS"):(s.result?(s.search?L_("bFound"):L_("bTerm")):(s.search?L_("bNone"):s.plan.result.dead?L_("bDerail"):L_("bRej")));
    d.innerHTML=`<span>${s.depart}</span><span><span class="code"></span></span><span class="dest"></span><span class="st">${label}${st==="ok"||st==="ng"?(s.verified?'<span class="vf">'+L_("vfOk")+'</span>':'<span class="vf bad">'+L_("vfNg")+'</span>'):""}</span>`;
    const c=d.querySelector(".code"); c.textContent=s.code; c.style.setProperty("--c",s.single?"#FFFFFF":s.col.startsWith("var")?"#C8C8C8":s.col);
    d.querySelector(".dest").textContent=s.str===""?L_("emptyStr"):s.str;
    box.appendChild(d);
  }
  if(!all.length){ const d=document.createElement("div"); d.className="brow wait"; d.innerHTML="<span></span><span></span><span class='dest'></span><span></span>"; d.querySelector(".dest").textContent=L_("noTrains"); box.appendChild(d); }
  const done=history.filter(s=>s.result!==undefined), ver=done.filter(s=>s.verified).length;
  $("bfDone").textContent=L_("bfDone",{n:done.length});
  if(massOn&&massDone.length){ const mins=Math.max((now-massStartReal)/60000,1/60); const chars=massDone.reduce((a,x)=>a+x.svc.str.length,0); $("bfRate").textContent=L_("bfRate",{a:(massDone.length/mins).toFixed(0),b:(chars/mins).toFixed(0)}); }
  else $("bfRate").textContent=L_("bfRateNone");
  $("bfVerify").textContent=L_("bfVerify",{v:ver,n:done.length});
}

/* ============================================================
   Controls
   ============================================================ */
const sampleBox=$("samples");
SAMPLES.forEach((s,i)=>{ const b=document.createElement("button"); b.className="chip"; b.style.setProperty("--c",s.color);
  b.innerHTML="<i></i><code></code><span></span>"; b.querySelector("code").textContent=s.re; b.querySelector("span").textContent=L_(s.name);
  b.addEventListener("click",()=>loadSample(i)); sampleBox.appendChild(b); });
function markSample(){ [...sampleBox.children].forEach((b,i)=>b.setAttribute("aria-current",String(i===curSample))); }
function setLineColor(c){ document.documentElement.style.setProperty("--line",c); }
function loadSample(i,{autorun=true}={}){
  curSample=i; const s=SAMPLES[i]; markSample(); setLineColor(s.color);
  $("signNo").textContent=String(i+1).padStart(2,"0"); $("lcdLine").textContent=L_(s.name);
  $("rx").value=s.re; $("str").value=s.str; $("list").value=s.list.join("\n");
  setSpeed(s.speed||1); stopAll();
  const ok=buildNetwork(s.re);
  if(ok&&autorun) pendingRun=s.str;
  return ok;
}
function stopAll(){ tourEnd(false); history=history.filter(h=>h.result!==undefined); for(const s of services){ for(const el of s.els.values()) el.remove(); } services=[]; massOn=false; massQueue=[]; pendingRun=null; hudFor=null; buildLcd(null); setLog(null); $("mTrains").textContent="0"; $("mSet").textContent="{}"; $("versus").classList.remove("show"); if(NET) showAccept(false); renderBoard(true); }
function rebuildFromInput(){
  const src=$("rx").value; curSample=SAMPLES.findIndex(s=>s.re===src); markSample();
  if(curSample<0){ setLineColor("var(--free)"); $("lcdLine").textContent=L_("freeLine"); }
  stopAll(); return buildNetwork(src);
}
$("bBuild").addEventListener("click",rebuildFromInput);
$("rx").addEventListener("keydown",e=>{ if(e.key==="Enter") rebuildFromInput(); });
$("bRun").addEventListener("click",()=>startSingle($("str").value));
$("str").addEventListener("keydown",e=>{ if(e.key==="Enter") startSingle($("str").value); });
function startSingle(str){
  if(hudFor&&tour.stage>=0) tourEnd(false);
  if(!NET||NET.src!==$("rx").value){ if(rebuildFromInput()) pendingRun=str; return; }
  if(NET.buildT<NET.buildEnd){ pendingRun=str; return; }
  for(const s of services.filter(s=>s.single)){ for(const el of s.els.values()){ el.remove(); } s.els.clear(); }
  services=services.filter(s=>!s.single);
  showAccept(false); $("versus").classList.remove("show");
  const svc=makeService(str,{single:true});
  hudFor=svc; hudK=-1; lcdKey=""; buildLcd(svc); $("mMax").textContent=svc.maxTrains; setLog(null);
  stepUntil=null; playing=true; syncPause(); renderBoard(true);
  if(camMode==="free") setCam("auto");
}
function setSpeed(s){ speed=s; $("bSpeed").textContent=L_("speed",{s:s<1?"½":s}); }
$("bSpeed").addEventListener("click",()=>{ const L=[.5,1,2,4]; setSpeed(L[(L.indexOf(speed)+1)%L.length]); });
function syncPause(){ $("bPause").textContent=playing?L_("pause"):L_("resume"); }
$("bPause").addEventListener("click",()=>{ if($("tour").classList.contains("show")){ tourNext(); return; } playing=!playing; stepUntil=null; syncPause(); });
$("bStep").addEventListener("click",()=>{ if($("tour").classList.contains("show")) tourNext(); const svc=hudFor; if(!svc) return; const t=simT-svc.t0; const nx=svc.plan.steps.find(s=>s.rides>0&&s.t+svc.plan.TM.RIDE+.02>t+.05); stepUntil=nx?svc.t0+nx.t+svc.plan.TM.RIDE+.02:null; playing=true; syncPause(); });
$("mFull").addEventListener("click",()=>setSearch(false)); $("mSearch").addEventListener("click",()=>setSearch(true));
function setSearch(v){ searchMode=v; $("mFull").setAttribute("aria-pressed",String(!v)); $("mSearch").setAttribute("aria-pressed",String(v)); stopAll(); }
$("bMass").addEventListener("click",()=>startMass());
$("bStop").addEventListener("click",()=>stopAll());
function startMass(){
  if(!NET) return;
  const list=$("list").value.split("\n").map(s=>s.replace(/\r/g,"")).filter((s,i,a)=>s.length||a.length===1);
  stopAll(); massQueue=list.slice(); massOn=true; massNext=simT; massStartReal=performance.now(); massDone=[];
  const nl=list.length; setDest(()=>{ $("lcdDestS").textContent=L_("massS"); $("lcdDest").textContent=L_("massN",{n:nl}); $("lcdDest").className=""; });
  if(speed<2) setSpeed(2);
  if(camMode==="free") setCam("auto");
  renderBoard(true);
}
function massTick(){
  if(!massOn||!NET||NET.buildT<NET.buildEnd) return;
  if(massQueue.length&&simT>=massNext&&services.filter(s=>!s.done).length<8){ makeService(massQueue.shift()); massNext=simT+2.4; renderBoard(true); }
  if(massOn){ const live=services.length; $("mTrains").textContent=services.reduce((a,s)=>{ const t=simT-s.t0; return a+s.plan.trains.filter(tr=>t>=tr.born&&t<tr.end).length; },0); $("mMax").textContent=live; }
}
let buildTO=0;
function showBuildMsg(t){ const m=$("buildMsg"); m.textContent=t; m.classList.add("show"); }
function hideBuildMsg(){ $("buildMsg").classList.remove("show"); }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.to); toast.to=setTimeout(()=>el.classList.remove("show"),2400); }

/* ============================================================
   Loop
   ============================================================ */
let lastT=performance.now(), fps={acc:0,n:0,avg:60};
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-lastT)/1000); lastT=now;
  fps.acc+=dt; fps.n++; if(fps.acc>1){ fps.avg=fps.n/fps.acc; fps.acc=0; fps.n=0; }
  if(NET){
    updateBuild(dt);
    if(pendingRun!==null&&NET.buildT>=NET.buildEnd+.2){ const s=pendingRun; pendingRun=null; startSingle(s); }
    if(playing&&tour.pauseAt!==null&&simT+dt*speed>=tour.pauseAt){ simT=tour.pauseAt; tour.pauseAt=null; playing=false; syncPause(); tourShow(); }
    else if(playing){ simT+=dt*speed; if(stepUntil!==null&&simT>=stepUntil){ simT=stepUntil; stepUntil=null; playing=false; syncPause(); } }
    massTick(); processEvents(); updateTrains(dt); updateHud(); renderBoard(false);
  }
  updateFx(dt); updateVersus(); updateCamera(dt); tourPlace();
}
// re-lay the map when the frame changes shape (trains keep running: the timetable is topological)
let relayTO=0, lastAspect=0;
new ResizeObserver(()=>{ const vs=viewSize(), a=vs.w/vs.h; if(!NET){ lastAspect=a; return; } if(Math.abs(Math.log(a/(lastAspect||a)))>.2){ clearTimeout(relayTO); relayTO=setTimeout(()=>{ lastAspect=viewSize().w/viewSize().h; for(const s of services){ for(const el of s.els.values()) el.remove(); s.els.clear(); } buildNetwork(NET.src,{animate:false,keep:true}); camSnap=true; },350); } else camSnap=camSnap||camMode!=="free"&&false; }).observe(wrap);

/* language switch: only texts change — the timetable, history, camera and clock keep going */
function relayNet(){
  if(!NET) return;
  const accOn=NET.ab.getAttribute("opacity")==="1", lf=lastFail;
  for(const s of services){ for(const el of s.els.values()) el.remove(); s.els.clear(); }
  buildNetwork(NET.src,{animate:false,keep:true});
  if(accOn) NET.ab.setAttribute("opacity",1);
  hotKey=undefined; hideBuildMsg();
  if(tour.ring&&tour.at>=0){ const v=NET.LY.N[tour.at]; tour.ring=mk("circle",{cx:v.x,cy:v.y,r:26,class:"tour-ring"},NET.G.top); }
  if(lf) fail(lf.msg,lf.pos,lf.src);
}
function refreshLangText(){
  [...sampleBox.children].forEach((b,i)=>{ b.querySelector("span").textContent=L_(SAMPLES[i].name); });
  $("lcdLine").textContent=curSample>=0?L_(SAMPLES[curSample].name):L_("freeLine");
  syncPause(); setSpeed(speed);
  if(lcdEnd) lcdEnd(); if(destFn) destFn(); if(logFn) logFn();
  if(vsNote) vsNote(); if(vsLast&&!vsAnim) drawVersus(vsLast,easeOut((performance.now()-vsLast.t0)/2400));
  if($("tour").classList.contains("show")) tourText();
  renderBoard(true);
}
function setLang(l){
  if(l!=="ja"&&l!=="en") return;
  if(l!==LANG){
    LANG=l; applyStatic(); refreshLangText();
    if(NET){ relayNet(); } else { const lf=lastFail; if(lf) fail(lf.msg,lf.pos,lf.src); }
  }
  try{ const u=new URL(location.href); u.searchParams.set("lang",l); window.history.replaceState(window.history.state,"",u.toString()); }catch(e){}
}
document.querySelectorAll("button[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
refreshLangText();

window.addEventListener("error",e=>{ (window.__rrErrors=window.__rrErrors||[]).push(String(e.message)); });
window.__rr={ready:false,
  load:(i,o)=>loadSample(i,o), build:src=>{ $("rx").value=src; return rebuildFromInput(); },
  run:str=>{ $("str").value=str; startSingle(str); }, mass:list=>{ if(list) $("list").value=list.join("\n"); startMass(); },
  cam:m=>setCam(m), speed:s=>setSpeed(s), search:v=>setSearch(v), lang:()=>LANG, setLang:l=>setLang(l),
  skipBuild:()=>{ if(NET){ NET.buildT=NET.buildEnd+.1; finishBuild(); } },
  state:()=>({built:!!NET&&NET.buildT>=NET.buildEnd,nfa:NET&&{n:NET.nfa.n,e:NET.nfa.edges.length,rows:NET.LY.rows},services:services.length,live:livePos.length,
    history:history.map(s=>({str:s.str,result:s.result,verified:s.verified,native:s.native,matched:s.matched})),fps:Math.round(fps.avg),simT}),
};
async function boot(){
  try{ await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  lastAspect=viewSize().w/viewSize().h;
  renderBoard(true);
  requestAnimationFrame(frame);
  loadSample(0);
  tourArm();
  window.__rr.ready=true;
}
boot();
})();
</script>
</body>
