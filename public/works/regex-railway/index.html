<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正規表現線</title>
<meta name="description" content="正規表現を路線図にする。文字列は列車になって分岐し、合流し、終点を目指す">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ramda.io">
<meta property="og:title" content="正規表現線">
<meta property="og:description" content="正規表現を路線図にする。文字列は列車になって分岐し、合流し、終点を目指す">
<meta property="og:url" content="https://www.ramda.io/works/regex-railway/">
<meta property="og:image" content="https://www.ramda.io/works/regex-railway/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="正規表現線">
<meta name="twitter:description" content="正規表現を路線図にする。文字列は列車になって分岐し、合流し、終点を目指す">
<meta name="twitter:image" content="https://www.ramda.io/works/regex-railway/ogp.png">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Overpass:wght@500;700;800;900&family=Overpass+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --chrome:#EEF0F2;
  --ink:#1C1C1E;
  --ink-2:#5B6169;
  --rule:#D5D9DE;
  --walk:#A7ADB4;
  --go:#00A651;
  --stop:#E60012;
  --line:#F39700;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
  --sign:"Overpass","Zen Kaku Gothic New",sans-serif;
  --mono:"Overpass Mono",ui-monospace,monospace;
  --dot:"DotGothic16",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #00A7DB;outline-offset:2px}
#app{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-areas:"panel map";height:100vh;height:100svh;overflow:hidden}

/* ---------- map column ---------- */
#mapcol{grid-area:map;display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0;background:var(--paper)}
#lcd{display:flex;align-items:stretch;background:#000;color:#fff;min-height:58px;overflow:hidden}
.lcd-kind{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;background:var(--line);color:#fff;font-weight:900;line-height:1.15;min-width:92px}
.lcd-kind b{font-size:20px;letter-spacing:.08em}
.lcd-kind small{font-size:11px;font-weight:700;opacity:.92}
.lcd-dest{display:flex;flex-direction:column;justify-content:center;padding:4px 16px;border-right:1px solid #333;min-width:120px}
.lcd-dest small{font-size:11px;color:#BDBDBD}
.lcd-dest b{font-size:19px;font-weight:900;letter-spacing:.1em;color:#FFB000}
.lcd-dest b.ok{color:#5BE37D}.lcd-dest b.ng{color:#FF5A5A}
#lcdChars{display:flex;align-items:center;gap:3px;padding:0 14px;overflow:hidden;flex:1;min-width:0}
.ch{min-width:26px;height:34px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono);font-weight:700;font-size:20px;color:#FFB000;border-bottom:3px solid transparent}
.ch.done{color:#5A4A1E}
.ch.now{background:#FFB000;color:#000;border-radius:3px}
.ch.end{font-family:var(--sans);font-size:12px;color:#BDBDBD}
#mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--paper)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#hudbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--rule);background:var(--paper);min-height:52px}
.ctr{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--ink-2)}
.ctr b{font-family:var(--sign);font-weight:900;font-size:24px;color:var(--ink);line-height:1}
.ctr code{font-family:var(--mono);font-size:13px;color:var(--ink)}
#stepLog{flex:1;min-width:200px;font-size:13px;color:var(--ink)}
.chipv{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:1px 9px;margin-left:6px;background:var(--go);color:#fff}
.chipv.bad{background:var(--stop)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 13px;font-size:13px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
#buildMsg{position:absolute;left:16px;top:12px;font-size:13px;font-weight:700;color:var(--ink-2);background:rgba(255,255,255,.9);padding:2px 8px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .4s}
#buildMsg.show{opacity:1}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:5px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

#legend{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.92);padding:8px 10px;border-radius:6px;box-shadow:0 0 0 1px var(--rule);font-size:11px;font-weight:700;pointer-events:none;max-width:46%}
.lg{display:flex;align-items:center;gap:7px}
.lg-b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border:3.5px solid;border-radius:10px;font-family:var(--sign);font-weight:900;font-size:11px;line-height:1;background:#fff;white-space:nowrap}
.lg-w{display:inline-block;width:20px;border-top:3px dotted var(--walk)}
/* infographic overlay on the map */
#versus{position:absolute;right:16px;bottom:16px;width:min(380px,calc(100% - 32px));background:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px 14px 12px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}
#versus.show{opacity:1;transform:none}

/* ---------- side panel ---------- */
#panel>*{flex-shrink:0}
#panel{grid-area:panel;background:var(--chrome);border-right:1px solid var(--rule);overflow-y:auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:20px;z-index:2}
.sign{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
.sign-top{display:flex;align-items:center;gap:12px;padding:10px 14px 6px}
.sign-num{display:grid;place-items:center;width:46px;height:46px;border:5px solid var(--line);border-radius:50%;background:#fff;line-height:1;flex:none;font-family:var(--sign)}
.sign-num small{font-size:10px;font-weight:800;margin-top:3px}
.sign-num b{font-size:18px;font-weight:900;margin-top:-3px}
.sign h1{margin:0;font-size:28px;line-height:1.1;font-weight:900;letter-spacing:.1em}
.sign p{margin:2px 0 0;font-size:11px;letter-spacing:.05em;color:var(--ink-2);font-family:var(--sign);font-weight:700}
.sign-band{display:flex;justify-content:space-between;background:var(--line);color:#fff;font-size:12px;font-weight:700;padding:3px 12px}
.field-name{font-size:13px;color:var(--ink-2);margin:0 0 6px;font-weight:700}
.rxrow{display:flex;gap:8px}
#rx{flex:1;min-width:0;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 11px;font-family:var(--mono);font-weight:700;font-size:19px}
#rx.bad{border-color:var(--stop)}
.btn{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px 13px;font-weight:700;white-space:nowrap}
.btn:hover{background:#F6F7F8}
.btn.go{background:var(--ink);color:#fff}
.btn.go:hover{background:#3A3A3E}
#rxErr{min-height:20px;font-size:13px;color:var(--stop);margin-top:6px;font-family:var(--mono);white-space:pre;overflow-x:auto}
#rxStat{font-size:13px;color:var(--ink-2)}
#rxStat b{color:var(--ink);font-family:var(--sign);font-weight:800}
.modes{margin-top:10px}
.samples{display:flex;flex-direction:column;gap:2px}
.chip{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px}
.chip:hover{background:#E3E6E9}
.chip[aria-current=true]{background:#fff;box-shadow:0 0 0 2px var(--ink)}
.chip i{width:22px;height:22px;border-radius:50%;border:5px solid var(--c);background:#fff}
.chip code{font-family:var(--mono);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{font-size:11px;color:var(--ink-2);text-align:right}
.ticket{display:flex;gap:8px}
#str{flex:1;min-width:0;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:7px 11px;font-family:var(--mono);font-weight:700;font-size:17px}
.runrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#list{width:100%;min-height:92px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:14px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--ink-2);margin:6px 0 0}
/* versus infographic (shared by panel card and map overlay) */
.vs-title{font-size:13px;font-weight:900;margin:0 0 8px}
.vs-row{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;margin-bottom:8px}
.vs-row .nm{font-size:12px;font-weight:700;line-height:1.3}
.vs-num{font-family:var(--sign);font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.vs-bar{grid-column:2;height:10px;border-radius:5px;background:#E6E8EB;overflow:hidden}
.vs-bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .2s linear}
.vs-row.bt .vs-num{color:var(--stop)}.vs-row.bt .vs-bar i{background:var(--stop)}
.vs-row.nfa .vs-num{color:var(--go)}.vs-row.nfa .vs-bar i{background:var(--go)}
.vs-note{font-size:11px;color:var(--ink-2);margin:0}
#vsCard{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 0 0 1px var(--rule)}
#vsCard[hidden]{display:none}
/* LED board (flat) */
.board{background:#000;border-radius:6px;padding:8px 10px 6px;font-family:var(--dot);color:#FF9F1C}
.board-head{display:grid;grid-template-columns:3.1em 2.6em 1fr 6.2em;gap:6px;color:#fff;font-size:12px;border-bottom:1px solid #333;padding-bottom:3px;margin-bottom:3px}
.board-rows{display:flex;flex-direction:column;gap:1px;min-height:44px}
.brow{display:grid;grid-template-columns:3.1em 2.6em 1fr 6.2em;gap:6px;align-items:center;font-size:14px;line-height:1.45}
.brow .code{display:inline-block;width:100%;text-align:center;color:#000;background:var(--c);border-radius:2px;font-size:11px;line-height:1.55}
.brow .dest{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .st{text-align:right;white-space:nowrap}
.brow.run .st{animation:blink 1s steps(2) infinite}
.brow.ok .st{color:#47E07A}.brow.ng .st{color:#FF4D4D}
.brow.wait{color:#6B4A12}
.brow .vf{font-size:10px;color:#7FD7FF;margin-left:3px}
.brow .vf.bad{color:#fff;background:var(--stop);padding:0 3px}
@keyframes blink{50%{opacity:.3}}
.board-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #333;margin-top:4px;padding-top:3px;font-size:11px;color:#fff}

/* ---------- SVG map ---------- */
#map text{font-family:var(--sign);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.walk{fill:none;stroke:var(--walk);stroke-width:3;stroke-linecap:round;stroke-dasharray:.1 7}
.walk-base{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round}
.casing{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.tline{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.stub{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 6}
.st-circ{fill:#fff;stroke:var(--ink);stroke-width:3.5}
.st-junc{fill:#fff;stroke:var(--walk);stroke-width:2.5}
.st-name{font-weight:900;font-size:14px;fill:var(--ink)}
.st-desc{font-family:var(--sans)!important;font-weight:700;font-size:10.5px;fill:var(--ink-2)}
.st-jnum{font-weight:700;font-size:9px;fill:var(--walk)}
.badge circle,.badge rect{fill:#fff;stroke-width:4.5}
.badge text{font-weight:900;font-size:13px;text-anchor:middle;dominant-baseline:central;stroke:none!important}
.badge.hot circle,.badge.hot rect{fill:var(--bc)}
.badge.hot text{fill:#fff!important}
.halo{opacity:.2}
.accept-badge rect{fill:var(--go)}
.accept-badge text{fill:#fff;font-weight:900;font-size:14px;stroke:none!important;font-family:var(--sans)!important}
.ring{fill:none}
.xmark{stroke:var(--stop);stroke-width:3.5;stroke-linecap:round}
.train .body{stroke-width:2.5}

@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;grid-template-areas:"map" "panel";height:auto;min-height:100svh;overflow:visible}
  #mapcol{height:72svh;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--rule)}
  #lcd{min-height:46px}
  .lcd-kind{min-width:64px;padding:4px 9px}.lcd-kind b{font-size:15px}.lcd-kind small{font-size:9px}
  .lcd-dest{min-width:0;padding:3px 9px}.lcd-dest b{font-size:14px}.lcd-dest small{font-size:9px}
  #lcdChars{padding:0 8px;gap:2px}
  .ch{min-width:17px;height:26px;font-size:15px;padding:0 2px}
  #hudbar{gap:10px;padding:6px 10px;min-height:0}
  .ctr b{font-size:19px}
  #stepLog{font-size:11.5px;min-width:100%;order:9;line-height:1.45}
  #panel{border-right:0;overflow:visible;padding:14px 14px 40px}
  .sign h1{font-size:24px}
  #versus{right:10px;bottom:10px;padding:10px 12px}
  #legend{display:none}
}
@media (prefers-reduced-motion:reduce){ .brow.run .st{animation:none} }
</style>
</head>
<body>
<div id="app">
  <main id="mapcol">
    <div id="lcd" aria-live="polite">
      <div class="lcd-kind"><b>各停</b><small id="lcdLine">正規表現線</small></div>
      <div class="lcd-dest"><small id="lcdDestS">行先</small><b id="lcdDest">受理</b></div>
      <div id="lcdChars"></div>
    </div>
    <div id="mapwrap">
      <svg id="map" role="img" aria-label="正規表現から作った路線図"></svg>
      <div id="buildMsg"></div>
      <div id="toast"></div>
      <div id="versus" aria-hidden="true"></div>
      <div id="legend" aria-label="凡例"></div>
    </div>
    <div id="hudbar">
      <div class="ctr"><b id="mTrains">0</b>本 走行中</div>
      <div class="ctr"><b id="mMax">0</b>本 最大</div>
      <div class="ctr">状態集合 <code id="mSet">{}</code></div>
      <div id="stepLog"></div>
      <div class="seg" role="group" aria-label="地図の表示">
        <button data-cam="auto" aria-pressed="true">追跡</button>
        <button data-cam="all" aria-pressed="false">全体</button>
      </div>
    </div>
  </main>

  <aside id="panel">
    <div class="sign" aria-hidden="true">
      <div class="sign-top">
        <div class="sign-num"><small>RX</small><b id="signNo">01</b></div>
        <div><h1>正規表現線</h1><p>Regular Expression Line</p></div>
      </div>
      <div class="sign-band"><span>← 文字列</span><span>受理 →</span></div>
    </div>

    <section>
      <h2 class="field-name"><label for="rx">正規表現</label></h2>
      <div class="rxrow">
        <input id="rx" spellcheck="false" autocomplete="off" autocapitalize="off" value="(a|b)*abb">
        <button class="btn" id="bBuild">路線図を作る</button>
      </div>
      <div id="rxErr" role="status"></div>
      <div id="rxStat"></div>
      <div class="seg modes" role="group" aria-label="照合の方法">
        <button id="mFull" aria-pressed="true">全体一致</button>
        <button id="mSearch" aria-pressed="false">部分一致（検索）</button>
      </div>
    </section>

    <section>
      <h2 class="field-name">路線を選ぶ</h2>
      <div class="samples" id="samples"></div>
    </section>

    <section>
      <h2 class="field-name"><label for="str">乗せる文字列</label></h2>
      <div class="ticket">
        <input id="str" spellcheck="false" autocomplete="off" autocapitalize="off" value="aababb">
        <button class="btn go" id="bRun">発車</button>
      </div>
      <div class="runrow">
        <button class="btn" id="bPause">一時停止</button>
        <button class="btn" id="bStep">1文字進める</button>
        <button class="btn" id="bSpeed">速さ ×1</button>
      </div>
    </section>

    <section id="vsCard" hidden></section>

    <section>
      <h2 class="field-name"><label for="list">ダイヤ（1行に1本）</label></h2>
      <textarea id="list" spellcheck="false"></textarea>
      <div class="runrow"><button class="btn go" id="bMass">ダイヤ運行を始める</button><button class="btn" id="bStop">運行をやめる</button></div>
      <p class="hint">何本もの列車を時刻表どおりに走らせ、結果を発車標に出します。どの結果もブラウザの RegExp と照合します。</p>
    </section>

    <section>
      <div class="board" id="board">
        <div class="board-head"><span>発車</span><span>列車</span><span>文字列</span><span style="text-align:right">状況</span></div>
        <div class="board-rows" id="boardRows"></div>
        <div class="board-foot"><span id="bfDone">運行 0本</span><span id="bfRate">毎分 —</span><span id="bfVerify">RegExp照合 0/0</span></div>
      </div>
    </section>
  </aside>
</div>
<script>
/*ENGINE-BEGIN*/
var RX=(function(){
"use strict";
function RxError(msg,pos){ var e=new Error(msg); e.pos=pos; e.rx=true; return e; }
var LINE_T=[[10,10],[13,13],[0x2028,0x2029]];
var DIGIT=[[48,57]], WORD=[[48,57],[65,90],[95,95],[97,122]];
var SPACE=[[9,13],[32,32],[0xa0,0xa0],[0x1680,0x1680],[0x2000,0x200a],[0x2028,0x2029],[0x202f,0x202f],[0x205f,0x205f],[0x3000,0x3000],[0xfeff,0xfeff]];
function csTest(cs,ch){ var c=ch.charCodeAt(0), r=cs.ranges, hit=false; for(var i=0;i<r.length;i++){ if(c>=r[i][0]&&c<=r[i][1]){ hit=true; break; } } return cs.neg?!hit:hit; }
function showCh(c){ return c===" "?"␣":c==="\t"?"\\t":c==="\n"?"\\n":c; }

/* ---- parser: literals . [..] [^..] \d\w\s | * + ? ( ) (?: ) and ^ $ at the ends ---- */
function parse(src){
  var i=0, end=src.length, aS=false, aE=false;
  if(src[0]==="^"){ aS=true; i=1; }
  if(end>i&&src[end-1]==="$"){ var b=0; for(var j=end-2;j>=i&&src[j]==="\\";j--) b++; if(b%2===0){ aE=true; end--; } }
  function err(m,p){ throw RxError(m,p===undefined?i:p); }
  function alt(){ var alts=[cat()]; while(i<end&&src[i]==="|"){ i++; alts.push(cat()); } return alts.length===1?alts[0]:{t:"alt",alts:alts}; }
  function cat(){ var items=[]; while(i<end&&src[i]!=="|"&&src[i]!==")") items.push(rep()); return items.length===1?items[0]:{t:"cat",items:items}; }
  function rep(){
    var a=atom();
    if(i<end&&"*+?".indexOf(src[i])>=0){
      var op=src[i++]; a={t:op==="*"?"star":op==="+"?"plus":"opt",a:a};
      if(i<end&&src[i]==="?") i++;            // lazy: same language
      if(i<end&&"*+?".indexOf(src[i])>=0) err("繰り返し記号を重ねるときは ( ) で囲んでください");
    }
    if(i<end&&src[i]==="{") err("{n,m} の回数指定には未対応です");
    return a;
  }
  function escTok(inClass){
    var p=i; i++; if(i>=end) err("「\\」のあとに文字がありません",p);
    var c=src[i++];
    if(c==="d") return {set:DIGIT,neg:false,label:"\\d"};
    if(c==="w") return {set:WORD,neg:false,label:"\\w"};
    if(c==="s") return {set:SPACE,neg:false,label:"\\s"};
    if("DWS".indexOf(c)>=0){ if(inClass) err("[ ] の中の \\"+c+" には未対応です",p); return {set:c==="D"?DIGIT:c==="W"?WORD:SPACE,neg:true,label:"\\"+c}; }
    var ctl={n:10,t:9,r:13,f:12,v:11}[c]; if(ctl!==undefined) return {code:ctl,label:"\\"+c};
    if(inClass&&c==="b") return {code:8,label:"\\b"};

  function classAtom(){ if(src[i]==="\\") return escTok(true); var c=src[i++]; return {code:c.charCodeAt(0)}; }

    if(c==="^"||c==="$") err("^ と $ はパターンの先頭と末尾にだけ置けます");

/* ---- Thompson's construction. Concatenation identifies the end of the left
   fragment with the start of the right one (the textbook form), so every
   ε-edge in the result comes from | * + ? ---- */
function compile(ast){

  function E(a,b,cs){ var e={from:a,to:b,cs:cs||null,order:edges.length}; edges.push(e); a.out.push(e); return e; }
  function merge(x,y){ if(x===y) return; y.out.forEach(function(e){ e.from=x; x.out.push(e); }); y.out=[]; edges.forEach(function(e){ if(e.to===y) e.to=x; }); y.dead=true; }

    switch(n.t){
      case "cs": { var s=S(), f=S(); E(s,f,n.cs); return {s:s,f:f}; }
      case "group": return b(n.a);
      case "cat": {
        if(!n.items.length){ var z=S(); return {s:z,f:z}; }
        var fr=b(n.items[0]);
        for(var k=1;k<n.items.length;k++){ var g=b(n.items[k]); var empty=g.s===g.f; merge(fr.f,g.s); if(!empty) fr={s:fr.s,f:g.f}; }

      case "alt": { var s1=S(), f1=S(); n.alts.forEach(function(a){ var g=b(a); E(s1,g.s); E(g.f,f1); }); return {s:s1,f:f1}; }
      case "star": { var s2=S(), f2=S(), g2=b(n.a); E(s2,g2.s); E(s2,f2); E(g2.f,g2.s); E(g2.f,f2); return {s:s2,f:f2}; }
      case "plus": { var s3=S(), f3=S(), g3=b(n.a); E(s3,g3.s); E(g3.f,g3.s); E(g3.f,f3); return {s:s3,f:f3}; }

  if(!id.has(fr.f)) id.set(fr.f,id.size);

  var E2=edges.filter(function(e){ return id.has(e.from); }).map(function(e,k){ return {id:k,from:id.get(e.from),to:id.get(e.to),cs:e.cs,label:e.cs?e.cs.label:"ε",order:e.order}; });

function closure(nfa,seeds){
  var seen=new Set(seeds), stk=seeds.slice();
  while(stk.length){ var s=stk.pop(); nfa.out[s].forEach(function(ei){ var e=nfa.edges[ei]; if(!e.cs&&!seen.has(e.to)){ seen.add(e.to); stk.push(e.to); } }); }

function move(nfa,set,ch){ var nx=new Set(); set.forEach(function(s){ nfa.out[s].forEach(function(ei){ var e=nfa.edges[ei]; if(e.cs&&csTest(e.cs,ch)) nx.add(e.to); }); }); return nx; }
// the plain set simulation (no timing) — the reference the animation plan is checked against
function simulate(nfa,str,opt){
  opt=opt||{}; var search=!!opt.search, aS=!!opt.aS, aE=!!opt.aE;
  var cur=closure(nfa,[nfa.start]), sets=[cur];
  if(search&&!aE&&cur.has(nfa.accept)) return {matched:true,sets:sets,at:0};
  for(var k=0;k<str.length;k++){
    var nx=move(nfa,cur,str[k]); if(search&&!aS) nx.add(nfa.start);
    cur=closure(nfa,Array.from(nx)); sets.push(cur);
    if(search&&!aE&&cur.has(nfa.accept)) return {matched:true,sets:sets,at:k+1};
    if(cur.size===0) return {matched:false,sets:sets,at:k+1,dead:true};

/* ---- the timetable: the same set simulation, but every member of the set is a
   train with a route. ε-closure is a race through the switches: the first train
   to reach a station holds it, later arrivals merge into it (set semantics).
   Stations with a lettered track (or the terminal) are where trains wait; then
   all of them depart together on the next letter. ---- */

    seeds.forEach(function(sd){ tEnd=Math.max(tEnd,sd.t); });
    while(q.length){
      var bi=0; for(var j=1;j<q.length;j++) if(q[j].t<q[bi].t-1e-9) bi=j;
      var it=q.splice(bi,1)[0], state=it.state, t=it.t, tr=it.tr;
      tEnd=Math.max(tEnd,t);
      if(reached.has(state)){ tr.fate="merge"; tr.end=t; tr.into=reached.get(state).id; events.push({t:t,type:"merge",state:state,tr:tr.id,k:k}); continue; }
      reached.set(state,tr);
      var eps=nfa.out[state].filter(function(ei){ return !E[ei].cs; });
      var carriers=[];
      if(sig(state)){ parked.push({state:state,tr:tr,t:t}); eps.forEach(function(ei){ carriers.push([mk(tr,t),ei]); }); }
      else { var cs0=eps.map(function(ei,j){ return j===0?tr:mk(tr,t); }); eps.forEach(function(ei,j){ carriers.push([cs0[j],ei]); }); if(!eps.length){ tr.fate="stop"; tr.end=t; } }
      var total=carriers.length+(sig(state)?1:0);
      if(total>1) events.push({t:t,type:"split",state:state,n:total,k:k,tr:tr.id});
      carriers.forEach(function(c){ c[0].legs.push({kind:"move",edge:c[1],t0:t,t1:t+TM.EPS}); q.push({state:E[c[1]].to,t:t+TM.EPS,tr:c[0]}); });
    }
    var set=Array.from(reached.keys()).sort(function(a,b){ return a-b; });
    var D=tEnd+TM.PAUSE;
    var stp={k:k,t:D,tClose:tEnd,t0:seeds.length?Math.min.apply(null,seeds.map(function(s){ return s.t; })):D,set:set,trains:parked.length,ch:k<n?str[k]:null,derails:0,rides:0};
    steps.push(stp);
    parked.forEach(function(p){ p.tr.legs.push({kind:"park",state:p.state,t0:p.t,t1:D}); });

      events.push({t:D,type:acc?"accept":"reject",state:acc?nfa.accept:-1,k:k});
      break;
    }
    var ch=str[k], next=[];
    parked.forEach(function(p){
      var m=nfa.out[p.state].filter(function(ei){ return E[ei].cs&&csTest(E[ei].cs,ch); });
      if(!m.length){ p.tr.fate="derail"; p.tr.end=D; stp.derails++; events.push({t:D,type:"derail",state:p.state,tr:p.tr.id,k:k,ch:ch}); return; }
      var cars=m.map(function(ei,j){ return j===0?p.tr:mk(p.tr,D); });
      if(m.length>1) events.push({t:D,type:"split",state:p.state,n:m.length,k:k,tr:p.tr.id});
      m.forEach(function(ei,j){ cars[j].legs.push({kind:"move",edge:ei,t0:D,t1:D+TM.RIDE,consume:k}); next.push({state:E[ei].to,t:D+TM.RIDE,tr:cars[j]}); });
    });
    stp.rides=next.length;
    if(search&&!aS) next.push(depart(D+TM.RIDE));
    if(!next.length){ result={matched:false,t:D,k:k,dead:true}; events.push({t:D,type:"reject",state:-1,k:k}); break; }
    seeds=next;
  }

  var lead=trains.filter(function(t){ return t.win; })[0]||trains.slice().sort(function(a,b){ return (b.end===Infinity?1e9:b.end)-(a.end===Infinity?1e9:a.end); })[0];
  for(var x=lead;x;x=x.parent>=0?trains[x.parent]:null) x.line=true;
  events.sort(function(a,b){ return a.t-b.t; });
  return {trains:trains,events:events,steps:steps,result:result,TM:TM,n:n,str:str};
}

// The JS RegExp the result is checked against (anchored full match, or search)
function nativeRe(p,search){ return search?new RegExp((p.aS?"^":"")+p.core+(p.aE?"$":"")):new RegExp("^(?:"+p.core+")$"); }

// A naive backtracking matcher on the same tree, counting its steps (for comparison only)
function btCount(ast,str,cap){
  cap=cap||3e6; var steps=0, STOP={};
  function m(nd,i,k){
    if(++steps>cap) throw STOP;
    switch(nd.t){
      case "cs": return i<str.length&&csTest(nd.cs,str[i])?k(i+1):false;
      case "group": return m(nd.a,i,k);
      case "cat": { var go=function(j,ix){ return ix===nd.items.length?k(j):m(nd.items[ix],j,function(jj){ return go(jj,ix+1); }); }; return go(i,0); }
      case "alt": for(var a=0;a<nd.alts.length;a++) if(m(nd.alts[a],i,k)) return true; return false;
      case "star": { var loop=function(j){ return m(nd.a,j,function(jj){ return jj!==j&&loop(jj); })||k(j); }; return loop(i); }
      case "plus": return m(nd.a,i,function(jj){ var loop=function(j){ return m(nd.a,j,function(j2){ return j2!==j&&loop(j2); })||k(j); }; return loop(jj); });

    }
  }
  try{ var r=m(ast,0,function(j){ return j===str.length; }); return {steps:steps,matched:r,capped:false}; }
  catch(e){ if(e===STOP) return {steps:steps,capped:true}; if(e instanceof RangeError) return {steps:steps,capped:true}; throw e; }
}
return {parse:parse,compile:compile,closure:closure,simulate:simulate,plan:plan,nativeRe:nativeRe,btCount:btCount,csTest:csTest};
})();

/* ============================================================
   Trains and timetable
   ============================================================ */
let services=[], history=[], simT=0, playing=true, speed=1, stepUntil=null, svcSeq=0;
let massOn=false, massQueue=[], massNext=0, massStartReal=0, massDone=[];
let searchMode=false, curSample=0, pendingRun=null, hudFor=null, hudK=-1;
const livePos=[];
function makeService(str,{single=false}={}){
  const p=NET.parsed, nfa=NET.nfa, opt={search:searchMode,aS:p.aS,aE:p.aE};
  const pl=RX.plan(nfa,str,opt), sim=RX.simulate(nfa,str,opt);
  let nat=null; try{ nat=RX.nativeRe(p,searchMode).test(str); }catch(e){}
  const idx=svcSeq++;
  const col=single?"#1C1C1E":TRAIN_PAL[idx%TRAIN_PAL.length];
  pl.trains.forEach(tr=>{ tr.legs.forEach((l,i)=>{ if(l.kind!=="move") return; const pv=tr.legs[i-1], nx=tr.legs[i+1]; l.ei=!pv?(tr.parent<0):pv.kind==="park"; l.eo=!nx?(tr.fate!=="merge"):nx.kind==="park"; }); });
  const consumeT=pl.steps.filter(s=>s.rides>0).map(s=>s.t+pl.TM.RIDE*.5);
  const svc={id:idx,str,plan:pl,t0:simT,col,single,consumeT,evI:0,search:searchMode,
    verified:nat===pl.result.matched&&sim.matched===pl.result.matched,native:nat,matched:pl.result.matched,
    tEnd:pl.result.t+2.6,done:false,code:String.fromCharCode(65+idx%26)+(1+Math.floor(idx/26)),maxTrains:Math.max(...pl.steps.map(s=>s.trains)),depart:clockLabel(idx),els:new Map()};
  services.push(svc); return svc;
}
function clockLabel(i){ const m=6*60+i*3; return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
const hermite=(u,v0,v1)=>{ const u2=u*u,u3=u2*u; return (u3-2*u2+u)*v0+(-2*u3+3*u2)+(u3-u2)*v1; };
function pathOf(ei){ return ei<0?NET.LY.depot:NET.LY.paths[ei]; }
const _o={x:0,y:0}, _o2={x:0,y:0}, _o3={x:0,y:0};
function headPos(tr,t){
  const legs=tr.legs; let li=0; for(let i=0;i<legs.length;i++){ if(legs[i].t0<=t+1e-9) li=i; else break; }
  const L=legs[li];
  if(L.kind==="park"){ const v=NET.LY.N[L.state]; _o.x=v.x; _o.y=v.y; return {o:_o,L}; }
  const p=pathOf(L.edge), u=clamp01((t-L.t0)/(L.t1-L.t0));
  pathAt(p,p.len*clamp01(hermite(u,L.ei?0:1,L.eo?0:1)),_o); return {o:_o,L};
}
// train dots (pooled SVG groups)
const pool=[];
function trainEl(){ let e=pool.pop(); if(!e){ e=mk("g",{class:"train"}); mk("rect",{class:"body",x:-14,y:-7.5,width:28,height:15,rx:7.5},e); mk("circle",{class:"lamp",cx:8,cy:0,r:2.6,fill:"#FFD24A"},e); } e.userData={}; NET.G.trains.appendChild(e); return e; }
function updateTrains(){
  livePos.length=0;
  const used=new Set();
  const halo=new Map();
  for(const svc of services){
    const t=simT-svc.t0; if(t<0||svc.done) continue;
    for(const tr of svc.plan.trains){
      if(t<tr.born) continue;
      const a=t-tr.end;
      let sc=1, op=1;
      if(tr.parent>=0&&t-tr.born<.35) sc=1+.7*(1-easeOut((t-tr.born)/.35));
      if(a>0){
        if(tr.fate==="merge"){ sc*=1-easeOut(a/.3); }
        else if(tr.fate==="derail"){ sc*=1-easeOut(a/.45); }
        else if(tr.fate==="accept"){ sc*=1+.25*Math.sin(a*7)*Math.exp(-a*.8); op=1-clamp01((a-2)/.5); }
        else { op=1-clamp01((a-.3)/.7); }
        if(sc<=.01||op<=.01) continue;
      }
      const {o,L}=headPos(tr,t);
      const ox=o.x, oy=o.y;
      let ang=null; if(L.kind==="move"){ const p=pathOf(L.edge), u=clamp01((t-L.t0)/(L.t1-L.t0)), s1=p.len*clamp01(hermite(u,L.ei?0:1,L.eo?0:1)); pathAt(p,Math.max(0,s1-3),_o2); pathAt(p,Math.min(p.len,s1+3),_o3); if(Math.hypot(_o3.x-_o2.x,_o3.y-_o2.y)>.5) ang=Math.atan2(_o3.y-_o2.y,_o3.x-_o2.x)*180/Math.PI; }
      let el=svc.els.get(tr.id); if(!el){ el=trainEl(); svc.els.set(tr.id,el); const c=el.firstChild; c.setAttribute("fill",svc.col); c.setAttribute("stroke","#fff"); const par=tr.parent>=0?svc.els.get(tr.parent):null; el.userData.ang=par&&par.userData.ang!=null?par.userData.ang:0; }
      if(ang!==null) el.userData.ang=ang;
      el.setAttribute("transform",`translate(${ox.toFixed(1)} ${oy.toFixed(1)}) rotate(${(el.userData.ang||0).toFixed(1)}) scale(${sc.toFixed(3)})`);
      el.style.opacity=op; used.add(el);
      if(t<tr.end){ livePos.push({x:ox,y:oy}); if(L.kind==="park"&&L.edge===undefined) halo.set(L.state,svc.col); }
    }
    if(t>svc.tEnd) svc.done=true;
  }
  // retire unused dots
  for(const svc of services){ for(const [id,el] of svc.els){ if(!used.has(el)){ el.remove(); pool.push(el); svc.els.delete(id); } } }
  NET.stEls.forEach((s,i)=>{ const c=halo.get(i); if(c){ s.halo.setAttribute("fill",c); s.halo.style.display=""; } else s.halo.style.display="none"; });
  services=services.filter(s=>{ if(s.done){ for(const el of s.els.values()){ el.remove(); pool.push(el); } s.els.clear(); return false; } return true; });
}
/* effects: rings and ✕ marks */
const fx=[];
function ring(x,y,color,{r0=10,r1=34,dur=.6,w=3,delay=0}={}){ if(!NET) return; const c=mk("circle",{cx:x,cy:y,r:r0,class:"ring",stroke:color,"stroke-width":w,opacity:0},NET.G.fx); fx.push({el:c,t:-delay,dur,r0,r1,w,kind:"ring"}); }
function xmark(x,y){ if(!NET) return; const g=mk("g",{transform:`translate(${x} ${y})`},NET.G.fx); mk("line",{x1:-7,y1:-7,x2:7,y2:7,class:"xmark"},g); mk("line",{x1:7,y1:-7,x2:-7,y2:7,class:"xmark"},g); fx.push({el:g,t:0,dur:1.3,kind:"x",x,y}); }
function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.t+=dt; const k=f.t/f.dur;
    if(k>=1){ f.el.remove(); fx.splice(i,1); continue; }
    if(f.t<0) continue;
    if(f.kind==="ring"){ f.el.setAttribute("r",f.r0+(f.r1-f.r0)*easeOut(k)); f.el.setAttribute("opacity",(1-k).toFixed(3)); f.el.setAttribute("stroke-width",(f.w*(1-k*.6)).toFixed(2)); }
    else { const s=k<.15?easeOut(k/.15)*1.2:1; f.el.setAttribute("transform",`translate(${f.x} ${f.y-14-k*6}) scale(${s.toFixed(3)})`); f.el.setAttribute("opacity",(1-clamp01((k-.6)/.4)).toFixed(3)); } }
}
function processEvents(){
  for(const svc of services){
    const t=simT-svc.t0, ev=svc.plan.events;
    while(svc.evI<ev.length&&ev[svc.evI].t<=t){
      const e=ev[svc.evI++]; const v=e.state>=0?NET.LY.N[e.state]:null;
      const loud=svc.single||services.length<=2;
      if(e.type==="split"&&v&&loud){ ring(v.x,v.y,svc.single?"#1C1C1E":svc.col,{r0:8,r1:24,dur:.45,w:2.5}); }
      else if(e.type==="merge"&&v){ ring(v.x,v.y,"#7B3F98",{r0:8,r1:30,dur:.55,w:3.5}); }
      else if(e.type==="derail"&&v){ xmark(v.x,v.y); }
      else if(e.type==="accept"){ finished(svc,true); if(v){ const k=svc.single?3:1; for(let i=0;i<k;i++) ring(v.x,v.y,"#00A651",{r0:14,r1:svc.single?90:44,dur:1.3,w:svc.single?5:3,delay:i*.28});
          if(svc.single){ showAccept(true); focusBox={x:v.x-120,y:v.y-90,w:240,h:180}; focusUntil=performance.now()+2600; } } }
      else if(e.type==="reject"){ finished(svc,false); }
    }
  }
}
function showAccept(on){ if(!NET) return; NET.ab.setAttribute("opacity",on?1:0); NET.abt.textContent=searchMode?"一致":"受理"; }
function finished(svc,ok){
  svc.result=ok;

function updateHud(){

  const S=pl.steps[k];

function setSearch(v){ searchMode=v; $("mFull").setAttribute("aria-pressed",String(!v)); $("mSearch").setAttribute("aria-pressed",String(v)); stopAll(); }
$("bMass").addEventListener("click",()=>startMass());
$("bStop").addEventListener("click",()=>stopAll());
function startMass(){
  if(!NET) return;
  const list=$("list").value.split("\n").map(s=>s.replace(/\r/g,"")).filter((s,i,a)=>s.length||a.length===1);
  stopAll(); massQueue=list.slice(); massOn=true; massNext=simT; massStartReal=performance.now(); massDone=[];
  $("lcdDestS").textContent="ダイヤ運行"; $("lcdDest").textContent=list.length+"本"; $("lcdDest").className="";
  if(speed<2) setSpeed(2);
  if(camMode==="free") setCam("auto");
  renderBoard(true);
}
function massTick(){
  if(!massOn||!NET||NET.buildT<NET.buildEnd) return;
  if(massQueue.length&&simT>=massNext&&services.filter(s=>!s.done).length<8){ makeService(massQueue.shift()); massNext=simT+2.4; renderBoard(true); }
  if(massOn){ const live=services.length; $("mTrains").textContent=services.reduce((a,s)=>{ const t=simT-s.t0; return a+s.plan.trains.filter(tr=>t>=tr.born&&t<tr.end).length; },0); $("mMax").textContent=live; }
}
let buildTO=0;
function showBuildMsg(t){ const m=$("buildMsg"); m.textContent=t; m.classList.add("show"); }
function hideBuildMsg(){ $("buildMsg").classList.remove("show"); }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.to); toast.to=setTimeout(()=>el.classList.remove("show"),2400); }

/* ============================================================
   Loop
   ============================================================ */
let lastT=performance.now(), fps={acc:0,n:0,avg:60};
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-lastT)/1000); lastT=now;
  fps.acc+=dt; fps.n++; if(fps.acc>1){ fps.avg=fps.n/fps.acc; fps.acc=0; fps.n=0; }
  if(NET){
    updateBuild(dt);
    if(pendingRun!==null&&NET.buildT>=NET.buildEnd+.2){ const s=pendingRun; pendingRun=null; startSingle(s); }
    if(playing){ simT+=dt*speed; if(stepUntil!==null&&simT>=stepUntil){ simT=stepUntil; stepUntil=null; playing=false; syncPause(); } }
    massTick(); processEvents(); updateTrains(); updateHud(); renderBoard(false);
  }
  updateFx(dt); updateVersus(); updateCamera(dt);
}
// re-lay the map when the frame changes shape (trains keep running: the timetable is topological)
let relayTO=0, lastAspect=0;
new ResizeObserver(()=>{ const vs=viewSize(), a=vs.w/vs.h; if(!NET){ lastAspect=a; return; } if(Math.abs(Math.log(a/(lastAspect||a)))>.2){ clearTimeout(relayTO); relayTO=setTimeout(()=>{ lastAspect=viewSize().w/viewSize().h; for(const s of services){ for(const el of s.els.values()) el.remove(); s.els.clear(); } buildNetwork(NET.src,{animate:false,keep:true}); camSnap=true; },350); } else camSnap=camSnap||camMode!=="free"&&false; }).observe(wrap);

window.addEventListener("error",e=>{ (window.__rrErrors=window.__rrErrors||[]).push(String(e.message)); });
window.__rr={ready:false,
  load:(i,o)=>loadSample(i,o), build:src=>{ $("rx").value=src; return rebuildFromInput(); },
  run:str=>{ $("str").value=str; startSingle(str); }, mass:list=>{ if(list) $("list").value=list.join("\n"); startMass(); },
  cam:m=>setCam(m), speed:s=>setSpeed(s), search:v=>setSearch(v),
  skipBuild:()=>{ if(NET){ NET.buildT=NET.buildEnd+.1; finishBuild(); } },
  state:()=>({built:!!NET&&NET.buildT>=NET.buildEnd,nfa:NET&&{n:NET.nfa.n,e:NET.nfa.edges.length,rows:NET.LY.rows},services:services.length,live:livePos.length,
    history:history.map(s=>({str:s.str,result:s.result,verified:s.verified,native:s.native,matched:s.matched})),fps:Math.round(fps.avg),simT}),
};
async function boot(){
  try{ await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  lastAspect=viewSize().w/viewSize().h;
  renderBoard(true);
  requestAnimationFrame(frame);
  loadSample(0);
  window.__rr.ready=true;
}
boot();
})();
</script>
</body>
</html>
